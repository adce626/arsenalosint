name: Link check

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies are needed: the checker only uses the Node standard
      # library and the global fetch API.
      - name: Probe catalog links
        run: npm run check:links
